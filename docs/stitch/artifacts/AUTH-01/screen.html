<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="stitch-provenance" content="https://stitch.withgoogle.com/projects/proj_claim_studio_v1/screens/screen_auth_01">
  <title>AUTH-01: 로그인 - 클레임센터 보고서 스튜디오</title>
  <style>
    :root {
      --bg-dark-primary: hsl(222, 47%, 11%);
      --bg-dark-secondary: hsl(217, 33%, 17%);
      --primary-500: hsl(217, 91%, 60%);
      --text-primary: hsl(210, 40%, 98%);
      --text-secondary: hsl(215, 20%, 65%);
      --glass-surface: hsla(217, 33%, 17%, 0.75);
      --danger: hsl(346, 87%, 60%);
    }
    body { background-color: var(--bg-dark-primary); color: var(--text-primary); font-family: Inter, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .state-controls { display: flex; gap: 8px; margin-bottom: 16px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
    .state-controls button { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .state-controls button:hover { background: var(--primary-500); }
    .auth-card { background: var(--glass-surface); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 40px; width: 440px; box-shadow: 0 12px 32px rgba(0,0,0,0.4); box-sizing: border-box; }
    .brand-logo { font-size: 24px; font-weight: 700; color: var(--primary-500); margin-bottom: 8px; text-align: center; }
    .subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; text-align: center; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 14px; margin-bottom: 6px; }
    input[type="email"], input[type="password"], select {
      width: 100%; padding: 12px; background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: var(--text-primary); box-sizing: border-box;
    }
    input:focus, button:focus, select:focus { outline: 2px solid var(--primary-500); outline-offset: 2px; }
    .text-ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-submit { width: 100%; padding: 14px; background: var(--primary-500); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .skeleton-loader { display: none; height: 4px; background: linear-gradient(90deg, rgba(255,255,255,0.1), var(--primary-500), rgba(255,255,255,0.1)); animation: pulse 1.5s infinite; margin-top: 12px; }
    .empty-state { display: none; padding: 16px; background: rgba(255,255,255,0.05); border-radius: 6px; text-align: center; margin-top: 12px; }
    .error-toast { display: none; padding: 12px; background: var(--danger); color: white; border-radius: 6px; margin-top: 12px; }
    .forbidden-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 0.3; } 100% { opacity: 0.6; } }
    @media (max-width: 1024px) { .auth-card { width: 90%; padding: 24px; } }
  </style>
</head>
<body>
  <div class="state-controls" role="toolbar" aria-label="화면 상태 시뮬레이터">
    <button onclick="setUIState('normal')">정상상태</button>
    <button onclick="setUIState('loading')">로딩상태</button>
    <button onclick="setUIState('empty')">빈상태</button>
    <button onclick="setUIState('error')">오류상태</button>
    <button onclick="setUIState('forbidden')">403권한없음</button>
  </div>

  <main class="auth-card" role="main">
    <div class="brand-logo text-ellipsis">클레임센터 보고서 스튜디오</div>
    <div class="subtitle">보안 로그인 관문 (AUTH-01)</div>
    <form id="authForm" aria-label="로그인 폼">
      <div class="form-group">
        <label for="email">이메일 주소</label>
        <input type="email" id="email" name="email" required placeholder="user@company.com" aria-required="true">
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required aria-required="true">
      </div>
      <button type="submit" class="btn-submit" aria-label="Enterprise SSO 로그인">Enterprise SSO 로그인</button>
    </form>

    <div id="emptyState" class="empty-state" aria-label="빈 상태">등록된 계정이 없습니다. 시스템 관리자에게 문의하세요.</div>
    <div id="errorState" class="error-toast" aria-label="오류 상태">인증에 실패했습니다. 비밀번호를 확인하세요.</div>
    <div id="loadingState" class="skeleton-loader" aria-live="polite" aria-label="인증 처리 중"></div>
  </main>

  <div id="forbiddenState" class="forbidden-modal" aria-label="403 권한 없음 모달">
    <div style="background:var(--bg-dark-secondary); padding:24px; border-radius:8px; text-align:center;">
      <h3>접근 권한이 없습니다 (HTTP 403)</h3>
      <p>로그인 권한이 차단된 계정입니다.</p>
      <button onclick="setUIState('normal')" style="background:var(--primary-500); color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">닫기</button>
    </div>
  </div>

  <script>
    function setUIState(state) {
      document.getElementById('authForm').style.display = (state === 'normal') ? 'block' : 'none';
      document.getElementById('loadingState').style.display = (state === 'loading') ? 'block' : 'none';
      document.getElementById('emptyState').style.display = (state === 'empty') ? 'block' : 'none';
      document.getElementById('errorState').style.display = (state === 'error') ? 'block' : 'none';
      document.getElementById('forbiddenState').style.display = (state === 'forbidden') ? 'flex' : 'none';
    }
  </script>
</body>
</html>
