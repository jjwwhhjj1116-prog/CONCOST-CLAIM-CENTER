<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="stitch-provenance" content="https://stitch.withgoogle.com/projects/proj_claim_studio_v1/screens/screen_aud_01">
  <title>AUD-01: 감사로그 - 클레임센터 보고서 스튜디오</title>
  <style>
    :root { --bg-dark: hsl(222, 47%, 11%); --glass: hsla(217, 33%, 17%, 0.75); --primary: hsl(217, 91%, 60%); --text: hsl(210, 40%, 98%); --danger: hsl(346, 87%, 60%); }
    body { background: var(--bg-dark); color: var(--text); font-family: Inter, sans-serif; padding: 24px; }
    .state-controls { display: flex; gap: 8px; margin-bottom: 16px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); width: fit-content; }
    .state-controls button { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .state-controls button:hover { background: var(--primary); }
    input { background: rgba(15,23,42,0.8); color: var(--text); border: 1px solid rgba(255,255,255,0.2); padding: 8px; border-radius: 4px; }
    input:focus, button:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
    .text-ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 20px; }
    button { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    .skeleton-loader { display: none; height: 60px; background: rgba(255,255,255,0.05); margin-top: 12px; animation: pulse 1.5s infinite; }
    .empty-state { display: none; padding: 24px; text-align: center; background: var(--glass); border-radius: 8px; }
    .error-toast { display: none; padding: 12px; background: var(--danger); color: white; border-radius: 6px; }
    .forbidden-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 0.2; } 100% { opacity: 0.6; } }
    @media (max-width: 1024px) { body { padding: 16px; } }
  </style>
</head>
<body>
  <div class="state-controls" role="toolbar" aria-label="화면 상태 시뮬레이터">
    <button onclick="setUIState('normal')">정상상태</button>
    <button onclick="setUIState('loading')">로딩상태</button>
    <button onclick="setUIState('empty')">빈상태</button>
    <button onclick="setUIState('error')">오류상태</button>
    <button onclick="setUIState('forbidden')">403권한없음</button>
  </div>

  <h2 class="text-ellipsis">시스템 감사로그 (AUD-01)</h2>

  <main id="mainContent" class="card" role="main">
    <input type="text" placeholder="감사로그 작업자 검색..." aria-label="감사로그 검색">
    <p class="text-ellipsis">Append-only 감사로그 조회 (읽기 전용)</p>
    <button aria-label="로그 필터 조회">[로그 필터 조회]</button>
  </main>

  <div id="emptyState" class="empty-state" aria-label="빈 상태">기록된 시스템 감사로그가 존재하지 않습니다.</div>
  <div id="errorState" class="error-toast" aria-label="오류 상태">감사로그 데이터 쿼리 실패.</div>
  <div id="loadingState" class="skeleton-loader" aria-live="polite" aria-label="감사로그 로딩중"></div>

  <div id="forbiddenState" class="forbidden-modal" aria-label="403 권한 없음 모달">
    <div style="background:var(--glass); padding:24px; border-radius:8px; text-align:center;">
      <h3>접근 권한이 없습니다 (HTTP 403)</h3>
      <button onclick="setUIState('normal')" style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; margin-top:12px;">닫기</button>
    </div>
  </div>

  <script>
    function setUIState(state) {
      document.getElementById('mainContent').style.display = (state === 'normal') ? 'block' : 'none';
      document.getElementById('loadingState').style.display = (state === 'loading') ? 'block' : 'none';
      document.getElementById('emptyState').style.display = (state === 'empty') ? 'block' : 'none';
      document.getElementById('errorState').style.display = (state === 'error') ? 'block' : 'none';
      document.getElementById('forbiddenState').style.display = (state === 'forbidden') ? 'flex' : 'none';
    }
  </script>
</body>
</html>
