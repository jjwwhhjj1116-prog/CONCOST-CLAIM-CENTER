# 클레임 업무 프로세스 6대 고정 유형 정의 명세 (Single Source of Truth)
# 원본 출처: docs/클레임 업무 프로세스.xlsx

claim_types:
  - id: TYPE-01
    order: 1
    name: "현장조사 및 수량산출이 필요한 클레임(하자, 기시공, 미시공 등)"
    core_flow:
      - 제안서
      - 계약
      - 착수회의
      - 현장조사(하자, 기시공, 미시공)
      - 수량산출 및 내역서 작성
      - 보고서 작성

  - id: TYPE-02
    order: 2
    name: "분석 보고서 작성 클레임(감정보완 신청서, 항소에 대한 반박, 공사비 적정성 검토 등)"
    core_flow:
      - 제안서
      - 계약
      - 필요시 착수회의
      - 자료접수(소장, 감정서, 공사비증액 등)
      - 자료분석
      - 감정보완 신청서 작성

  - id: TYPE-03
    order: 3
    name: "일반적인 클레임"
    core_flow:
      - 제안서
      - 계약
      - 착수회의
      - 자료 접수 및 분석
      - 필요시 현장조사
      - 업무 성격에 맞는 보고서

  - id: TYPE-04
    order: 4
    name: "재건축·재개발 공사비 협상"
    core_flow:
      - 업무협의
      - 제안서
      - 계약
      - 착수회의
      - 자료접수(시공사 증액사유서 등)
      - 공사비 적정성 보고서
      - 시공사와의 협상지원(협상회의 참석)
      - 시공사 반박 자료 검토
      - 반박 보고서 작성
    repeatable_steps:
      - 시공사와의 협상지원(협상회의 참석)
      - 시공사 반박 자료 검토
      - 반박 보고서 작성

  - id: TYPE-05
    order: 5
    name: "사감정보고서"
    core_flow:
      - 제안서
      - 계약
      - 필요시 착수회의
      - 자료접수
      - 필요시 현장조사
      - 사감정 보고서 작성
      - 업무협의(사감정보고서 활용방안)
      - 법원감정인 선정 지원
      - 법원감정인 현장조사시 동행
      - 감정서 접수
      - 감정보완신청서 작성

  - id: TYPE-06
    order: 6
    name: "물가변동"
    core_flow:
      - 업무의뢰
      - 추정보고서 작성
      - 계약
      - 자료접수
      - 보고서 작성
