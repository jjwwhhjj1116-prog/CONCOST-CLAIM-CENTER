services:
  hocuspocus:
    build: ./collaboration-server
    restart: unless-stopped
    env_file: .env
    expose:
      - "1234"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - claim_private

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: claim_center
      POSTGRES_USER: claim_center
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - claim_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claim_center -d claim_center"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - claim_private

networks:
  claim_private:
    internal: true

volumes:
  claim_postgres:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
